<!DOCTYPE html>

    <meta charset="UTF-8">

</head>
<body>

    <div class="navbar">
        <div class="logo">İstanbul Turları</div>
        <div class="menuleri-tut">
            <a href="../index.html">Ana Sayfa</a>
            <a href="turlar.html">Turlarımız</a>
            <a href="gezilecek_yerler.html">Gezilecek Yerler</a>
            <a href="tarihce.html">Şehir Tarihi</a>
            <a href="sepet.html">Sepetim</a>
            <a href="iletisim.html">İletişim</a>
        </div>
    </div>
    <div class="ana-icerik">
        <h1>Bizimle İletişime Geçin</h1>
        <p>Turlarımız hakkında sorularınız varsa veya özel tur talebinde bulunmak istiyorsanız formu doldurabilirsiniz.</p>
        
        <div class="form-kutusu">
            <form onsubmit="return formuGonder()">
                
                <div class="form-grup">
                    <label for="adsoyad">Adınız Soyadınız:</label>
                    <input type="text" id="adsoyad" required placeholder="Lütfen adınızı yazın...">
                </div>

                <div class="form-grup">
                    <label for="eposta">E-Posta Adresiniz:</label>
                    <input type="email" id="eposta" required placeholder="E-posta adresinizi girin...">
                </div>

                <div class="form-grup">
                    <label for="mesaj">Mesajınız:</label>
                    <textarea id="mesaj" rows="5" required placeholder="Mesajınızı buraya yazabilirsiniz..."></textarea>
                </div>

                <button type="submit" class="form-btn">Mesajı Gönder</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 İstanbul Turizm Acentesi - Tüm Hakları Saklıdır.</p>
    </div>
    <script src="../scripts/myscript.js"></script>
